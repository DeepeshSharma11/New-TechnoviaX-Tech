<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - TechnoviaX</title>
    
    <!-- Dynamic Favicon Loader -->
    <script src="js/favicon-loader.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        'primary-dark': '#1e3a8a',
                        'primary-light': '#3b82f6',
                        secondary: '#0f172a',
                        accent: '#059669',
                        'accent-dark': '#047857',
                        'accent-light': '#10b981',
                        light: '#f8fafc',
                        dark: '#1e293b',
                        'dark-light': '#334155',
                        success: '#10b981',
                        warning: '#f59e0b',
                        error: '#dc2626',
                        info: '#3b82f6',
                        whatsapp: '#25D366',
                        'whatsapp-dark': '#128C7E',
                        'pastel-blue': '#eff6ff',
                        'pastel-green': '#f0fdf4',
                        'pastel-purple': '#f5f3ff',
                        'pastel-pink': '#fdf2f8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.5s ease-in',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        #auth-loading {
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
        }
        .loading-logo { color: white; font-size: 2rem; font-weight: 800; margin-bottom: 1rem; }
        .loading-logo span { color: #059669; }
        html{scroll-behavior:smooth;scroll-padding-top:100px}
    </style>
</head>
<body class="bg-light text-secondary font-sans">

    <!-- Auth Loading Screen -->
    <div id="auth-loading" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loading-logo">Technovia<span>X</span></div>
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>
        <p class="text-white mt-4 font-medium">Verifying Identity...</p>
    </div>

    <!-- Navigation Injection -->
    <script src="js/navigation.js" defer></script>

    <!-- Main Content Wrapper -->
    <main id="main-content" class="min-h-screen pt-24 pb-12">
        <div class="container mx-auto px-4">
            
            <!-- Welcome Header (Replacing the Dashboard Header) -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 animate-on-scroll">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-4">
                        <div class="h-16 w-16 rounded-full bg-pastel-blue border-2 border-blue-100 flex items-center justify-center text-primary text-2xl font-bold shadow-sm" id="user-avatar">
                            U
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-secondary">Welcome, <span id="user-name" class="text-primary">User</span>!</h1>
                            <p id="user-email" class="text-dark-light">loading@example.com</p>
                        </div>
                    </div>
                    <div>
                        <button id="logout-btn" class="flex items-center gap-2 px-5 py-2.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors font-medium border border-red-100">
                            <i class="fas fa-sign-out-alt"></i> Sign Out
                        </button>
                    </div>
                </div>
            </div>

            <!-- Dashboard Content -->
            
            <!-- Stats Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 animate-on-scroll">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-dark-light mb-1 font-medium">Total Tickets</p>
                            <h3 class="text-3xl font-bold text-secondary" id="stats-total">0</h3>
                        </div>
                        <div class="p-3 bg-pastel-blue rounded-xl text-primary">
                            <i class="fas fa-ticket-alt text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-dark-light mb-1 font-medium">Pending</p>
                            <h3 class="text-3xl font-bold text-warning" id="stats-pending">0</h3>
                        </div>
                        <div class="p-3 bg-yellow-50 rounded-xl text-warning">
                            <i class="fas fa-clock text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-dark-light mb-1 font-medium">Resolved</p>
                            <h3 class="text-3xl font-bold text-success" id="stats-resolved">0</h3>
                        </div>
                        <div class="p-3 bg-pastel-green rounded-xl text-success">
                            <i class="fas fa-check-circle text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action & Filter Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 animate-on-scroll">
                <h3 class="text-xl font-bold text-secondary">My Recent Tickets</h3>
                <button onclick="document.getElementById('new-ticket-modal').classList.remove('hidden')" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-bold shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 w-full sm:w-auto flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> New Ticket
                </button>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden animate-on-scroll">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-dark-light border-b border-gray-100">
                            <tr>
                                <th class="px-6 py-4 font-semibold">Subject</th>
                                <th class="px-6 py-4 font-semibold">Ticket ID</th>
                                <th class="px-6 py-4 font-semibold">Date</th>
                                <th class="px-6 py-4 font-semibold">Status</th>
                                <th class="px-6 py-4 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tickets-table-body" class="divide-y divide-gray-100">
                            <!-- Data will be inserted here by JS -->
                            <tr>
                                <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                                    <div class="flex flex-col items-center">
                                        <i class="fas fa-circle-notch fa-spin text-2xl text-primary mb-2"></i>
                                        <span>Loading your data...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Empty State (Hidden by default) -->
                <div id="empty-state" class="hidden p-12 text-center">
                    <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                        <i class="fas fa-clipboard-list text-3xl"></i>
                    </div>
                    <h4 class="text-lg font-bold text-secondary mb-2">No Tickets Yet</h4>
                    <p class="text-dark-light mb-6">You haven't created any support tickets yet.</p>
                    <button onclick="document.getElementById('new-ticket-modal').classList.remove('hidden')" class="text-primary font-bold hover:underline">Create your first ticket</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Injection -->
    <div id="footer-container"></div>
    <script src="js/footer.js" defer></script>

    <!-- Auto Quote Popup Injection -->
    <script src="quote-popup.js" defer></script>

    <!-- New Ticket Modal -->
    <div id="new-ticket-modal" class="hidden fixed inset-0 bg-secondary/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-100 transition-transform">
            <div class="bg-gradient-to-r from-primary to-primary-dark p-6 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">Create New Ticket</h3>
                <button onclick="document.getElementById('new-ticket-modal').classList.add('hidden')" class="text-white/80 hover:text-white transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <form id="create-ticket-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-1">Subject</label>
                        <input type="text" id="ticket-subject" required class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all bg-gray-50 focus:bg-white" placeholder="Brief summary of issue">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-1">Priority</label>
                        <select id="ticket-priority" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all bg-gray-50 focus:bg-white">
                            <option value="Low">Low - General Question</option>
                            <option value="Medium" selected>Medium - Feature Request/Minor Bug</option>
                            <option value="High">High - Critical Issue</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-secondary mb-1">Description</label>
                        <textarea id="ticket-desc" rows="4" required class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all bg-gray-50 focus:bg-white" placeholder="Detailed explanation..."></textarea>
                    </div>
                    <button type="submit" class="w-full btn-primary py-3 rounded-lg font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i> Submit Ticket
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { auth, db, signOut, onAuthStateChanged } from "./js/loginfirebase.js";
        import { collection, query, where, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const authLoading = document.getElementById('auth-loading');
        const ticketsTableBody = document.getElementById('tickets-table-body');
        const emptyState = document.getElementById('empty-state');
        let currentUser = null;

        // Auth Guard & User Info
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                currentUser = user;
                
                // Fade out loading screen
                authLoading.style.opacity = '0';
                setTimeout(() => {
                    authLoading.style.display = 'none';
                }, 500);
                
                // Update UI with User Info
                document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('user-email').innerText = user.email;
                if(user.photoURL) {
                    document.getElementById('user-avatar').innerHTML = `<img src="${user.photoURL}" class="w-full h-full rounded-full object-cover">`;
                } else {
                    document.getElementById('user-avatar').innerText = (user.email[0] || 'U').toUpperCase();
                }

                // Load Data
                loadUserTickets(user.uid);
            } else {
                // User is signed out -> Redirect to Login
                window.location.href = 'login.html'; 
            }
        });

        // Logout Logic
        document.getElementById('logout-btn').addEventListener('click', async () => {
            if(confirm('Are you sure you want to sign out?')) {
                try {
                    await signOut(auth);
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error("Logout Error", error);
                }
            }
        });

        // Load User Tickets
        function loadUserTickets(userId) {
            const q = query(
                collection(db, "tickets"),
                where("userId", "==", userId)
            );

            onSnapshot(q, (snapshot) => {
                const tickets = [];
                snapshot.forEach((doc) => {
                    tickets.push({ id: doc.id, ...doc.data() });
                });

                // Sort client-side
                tickets.sort((a, b) => {
                    const dateA = a.createdAt ? a.createdAt.toDate() : new Date(0);
                    const dateB = b.createdAt ? b.createdAt.toDate() : new Date(0);
                    return dateB - dateA; // Descending
                });

                updateDashboardUI(tickets);
            }, (error) => {
                console.error("Error fetching tickets:", error);
                ticketsTableBody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-red-500 bg-red-50 rounded-lg">Error loading data. Please try refreshing.</td></tr>`;
            });
        }

        // Update UI
        function updateDashboardUI(tickets) {
            // Update Stats
            document.getElementById('stats-total').innerText = tickets.length;
            document.getElementById('stats-pending').innerText = tickets.filter(t => t.status === 'Pending').length;
            document.getElementById('stats-resolved').innerText = tickets.filter(t => t.status === 'Resolved' || t.status === 'Closed').length;

            // Update Table
            if (tickets.length === 0) {
                ticketsTableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                ticketsTableBody.parentElement.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                ticketsTableBody.parentElement.classList.remove('hidden');
                ticketsTableBody.innerHTML = tickets.map(ticket => {
                    let dateStr = "Just now";
                    if (ticket.createdAt && ticket.createdAt.toDate) {
                        dateStr = ticket.createdAt.toDate().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                    } else if (ticket.date) {
                        dateStr = ticket.date;
                    }

                    const statusColors = {
                        'Pending': 'bg-yellow-100 text-yellow-800 border border-yellow-200',
                        'Open': 'bg-blue-100 text-blue-800 border border-blue-200',
                        'In Progress': 'bg-purple-100 text-purple-800 border border-purple-200',
                        'Resolved': 'bg-green-100 text-green-800 border border-green-200',
                        'Closed': 'bg-gray-100 text-gray-800 border border-gray-200'
                    };
                    const statusClass = statusColors[ticket.status] || 'bg-gray-100 text-gray-800';

                    return `
                        <tr class="hover:bg-gray-50 transition-colors border-b border-gray-50 last:border-0">
                            <td class="px-6 py-4">
                                <div class="font-bold text-secondary">${ticket.subject || 'No Subject'}</div>
                                <div class="text-xs text-gray-400 md:hidden mt-1">#${ticket.ticketDisplayId || ticket.id.slice(0, 6)}</div>
                            </td>
                            <td class="px-6 py-4 text-primary font-mono text-xs font-medium hidden md:table-cell">
                                #${ticket.ticketDisplayId || ticket.id.slice(0, 8)}
                            </td>
                            <td class="px-6 py-4 text-dark-light text-sm">${dateStr}</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}">
                                    ${ticket.status || 'Pending'}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-primary hover:text-primary-dark text-sm font-bold bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded transition-colors">
                                    Details
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Create Ticket
        document.getElementById('create-ticket-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const subject = document.getElementById('ticket-subject').value;
            const priority = document.getElementById('ticket-priority').value;
            const desc = document.getElementById('ticket-desc').value;
            const btn = e.target.querySelector('button');

            if (!currentUser) return;

            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                const date = new Date();
                const dateStr = date.getFullYear() + (date.getMonth() + 1).toString().padStart(2, '0') + date.getDate().toString().padStart(2, '0');
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                const readableTicketId = `TKT-${dateStr}-${randomNum}`;

                await addDoc(collection(db, "tickets"), {
                    userId: currentUser.uid, 
                    userEmail: currentUser.email,
                    userName: currentUser.displayName || 'User',
                    ticketDisplayId: readableTicketId,
                    subject: subject,
                    priority: priority,
                    description: desc,
                    status: "Pending",
                    createdAt: serverTimestamp(),
                    date: new Date().toLocaleDateString()
                });
                
                document.getElementById('new-ticket-modal').classList.add('hidden');
                e.target.reset();
            } catch (error) {
                console.error("Error creating ticket:", error);
                alert("Failed to create ticket: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        });

        // Simple Animation Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animated');
                }
            });
        });
        document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));

    </script>
</body>
</html>
