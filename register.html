<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TechnoviaX Tech</title>
    <script src="js/favicon-loader.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        .glass-bg {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="font-sans text-secondary bg-slate-50">

    <header class="fixed w-full top-0 z-40 p-4">
        <a href="/" class="text-2xl font-bold text-white drop-shadow-md">Technovia<span class="text-cyan-400">X</span></a>
    </header>

    <main class="min-h-screen flex items-center justify-center glass-bg relative py-20">
        <div class="absolute inset-0 bg-gradient-to-br from-white/60 to-blue-50/60 backdrop-blur-[2px]"></div>

        <div class="container mx-auto px-4 relative z-10">
            <div class="max-w-md mx-auto glass-card overflow-hidden shadow-2xl p-8">
                
                <div class="text-center mb-6">
                    <h1 class="text-3xl font-bold mb-2 text-gray-800">Create Account</h1>
                    <p class="text-gray-600">Join TechnoviaX Community</p>
                </div>

                <!-- Error Message Container -->
                <div id="signup-error" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-700 border border-red-200"></div>

                <form id="signup-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">Full Name</label>
                        <input type="text" id="signup-name" class="w-full px-4 py-3 rounded-xl glass-input outline-none" placeholder="John Doe" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">Email Address</label>
                        <input type="email" id="signup-email" class="w-full px-4 py-3 rounded-xl glass-input outline-none" placeholder="name@company.com" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">Password</label>
                        <input type="password" id="signup-password" class="w-full px-4 py-3 rounded-xl glass-input outline-none" placeholder="••••••••" required minlength="6">
                    </div>

                    <button type="submit" id="signup-btn" class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 mt-6">
                        <span>Sign Up</span>
                        <i class="fas fa-user-plus"></i>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-gray-600 text-sm">
                        Already have an account? 
                        <a href="/login.html" class="text-primary font-bold hover:underline">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Connect Logic -->
    <script src="js/loginfirebase.js" type="module"></script>
</body>
</html>
