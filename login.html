<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechnoviaX Tech</title>
    <meta name="description" content="Login to your TechnoviaX account to access premium features and support.">
    
    <!-- Dynamic Favicon -->
    <script src="js/favicon-loader.js"></script>

    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        'primary-dark': '#1d4ed8',
                        secondary: '#0f172a',
                        accent: '#22d3ee',
                        'accent-dark': '#06b6d4',
                        light: '#f8fafc',
                        gray: '#64748b',
                        whatsapp: '#25D366',
                        'whatsapp-dark': '#128C7E',
                        success: '#10b981',
                        error: '#ef4444',
                        'pastel-blue': '#a5d8ff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        /* Loading animation */
        .loader {
            border-top-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animations */
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Glassmorphism Styles --- */
        .glass-bg {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7); /* Lighter for better readability */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border-radius: 24px;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e5e7eb;
            color: #1f2937;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="font-sans text-secondary bg-slate-50">

    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 bg-white z-50 flex items-center justify-center transition-opacity duration-500">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
    </div>
    
    <!-- Minimal Header (Replaces navigation.js injection) -->
    <header class="fixed top-0 left-0 w-full p-6 z-50">
        <div class="container mx-auto">
            <a href="/" class="text-2xl font-bold text-white drop-shadow-md flex items-center gap-2 hover:opacity-90 transition-opacity w-fit">
                Technovia<span class="text-accent">X</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="min-h-screen flex items-center justify-center glass-bg relative py-20 px-4">
        <!-- Overlay to make text readable -->
        <div class="absolute inset-0 bg-gradient-to-br from-white/60 to-blue-50/60 backdrop-blur-[2px]"></div>

        <div class="relative z-10 w-full max-w-md">
            <div class="glass-card overflow-hidden animate-fade-in-up shadow-2xl">
                <div class="p-8">
                    <div class="text-center mb-8">
                        <div class="inline-block p-3 rounded-full bg-blue-50 mb-4 shadow-inner text-primary">
                            <i class="fas fa-user-circle text-4xl"></i>
                        </div>
                        <h1 class="text-3xl font-bold mb-2 text-gray-800">Welcome Back</h1>
                        <p class="text-gray-600">Sign in to your dashboard</p>
                    </div>

                    <!-- Login Area -->
                    <div id="login-container">
                        <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-gray-800 font-semibold py-3 px-4 rounded-xl transition-all shadow border border-gray-200 group transform hover:-translate-y-0.5 mb-6">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6 group-hover:scale-110 transition-transform">
                            <span>Sign in with Google</span>
                        </button>

                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-4 bg-white/50 text-gray-500 font-medium backdrop-blur-sm rounded">or continue with email</span>
                            </div>
                        </div>

                        <form id="email-login-form" class="space-y-5">
                            <div>
                                <label for="email" class="block text-sm font-bold text-gray-700 mb-1 ml-1">Email Address</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-envelope text-gray-400"></i>
                                    </div>
                                    <input type="email" id="email" class="w-full pl-10 pr-4 py-3 rounded-xl glass-input focus:ring-2 focus:ring-primary focus:border-transparent outline-none" placeholder="name@company.com" required>
                                </div>
                            </div>
                            <div>
                                <label for="password" class="block text-sm font-bold text-gray-700 mb-1 ml-1">Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </div>
                                    <input type="password" id="password" class="w-full pl-10 pr-4 py-3 rounded-xl glass-input focus:ring-2 focus:ring-primary focus:border-transparent outline-none" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-blue-600 to-primary hover:from-blue-700 hover:to-primary-dark text-white font-bold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-blue-500/30 flex items-center justify-center gap-2 mt-4 transform hover:scale-[1.02]">
                                <span>Sign In</span>
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </form>
                        
                        <p id="error-message" class="mt-4 text-center text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-100 hidden"></p>
                    </div>

                    <!-- User Info Area (Visible after login) -->
                    <div id="user-container" class="hidden text-center py-6">
                        <div class="relative inline-block mb-4">
                            <img id="profile-pic" src="" alt="Profile" class="w-28 h-28 rounded-full border-4 border-white shadow-xl object-cover">
                            <div class="absolute bottom-1 right-1 w-5 h-5 bg-green-500 border-2 border-white rounded-full"></div>
                        </div>
                        <h3 id="user-name" class="text-2xl font-bold text-gray-800 mb-1"></h3>
                        <p id="user-email" class="text-gray-600 mb-8 font-medium bg-gray-100 inline-block px-4 py-1 rounded-full"></p>
                        <button id="sign-out-btn" class="w-full bg-white hover:bg-red-50 border border-gray-200 text-gray-700 hover:text-red-600 font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 group">
                            <i class="fas fa-sign-out-alt group-hover:rotate-180 transition-transform duration-300"></i> Sign Out
                        </button>
                    </div>

                </div>
                <!-- Footer inside Card -->
                <div class="bg-white/40 backdrop-blur-md px-8 py-5 border-t border-white/40 text-center text-sm text-gray-600 font-medium">
                    Don't have an account? <a href="/register.html" class="text-primary hover:text-primary-dark hover:underline transition-colors font-bold">Create an Account</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Init Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            if(loading) {
                setTimeout(() => {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.style.display = 'none', 300);
                }, 300);
            }
        });
    </script>

    <!-- Firebase Logic Script Link -->
    <script src="js/loginfirebase.js" type="module"></script>
</body>
</html>
