<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechnoviaX Tech | Access Dashboard</title>
    <meta name="description" content="Secure login for TechnoviaX Tech clients and staff. Access your dashboard, manage services, and get support.">
    
    <!-- Dynamic Favicon -->
    <script src="js/favicon-loader.js"></script>

    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS & Config (Synced with Index/Services) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        'primary-dark': '#1e3a8a',
                        'primary-light': '#3b82f6',
                        secondary: '#0f172a',
                        accent: '#059669',
                        'accent-dark': '#047857',
                        'accent-light': '#10b981',
                        light: '#f8fafc',
                        dark: '#1e293b',
                        'dark-light': '#334155',
                        success: '#10b981',
                        warning: '#f59e0b',
                        error: '#dc2626',
                        info: '#3b82f6',
                        whatsapp: '#25D366',
                        'whatsapp-dark': '#128C7E',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeInUp: {
                            'from': { opacity: '0', transform: 'translateY(20px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        /* Shared Styles */
        .whatsapp-float{position:fixed;width:60px;height:60px;bottom:40px;right:40px;background-color:#25D366;color:#FFF;border-radius:50px;text-align:center;font-size:30px;box-shadow:2px 2px 8px rgba(0,0,0,0.3);z-index:1000;display:flex;align-items:center;justify-content:center;transition:all 0.3s ease;text-decoration:none}
        .whatsapp-float:hover{background-color:#128C7E;transform:scale(1.1);box-shadow:3px 3px 12px rgba(0,0,0,0.4)}
        
        .sticky-cta{position:fixed;bottom:40px;left:40px;background:linear-gradient(135deg,#1e40af 0%,#3b82f6 100%);color:white;padding:12px 24px;border-radius:50px;text-decoration:none;font-weight:600;box-shadow:2px 2px 10px rgba(30,64,175,0.3);z-index:999;display:flex;align-items:center;gap:8px;transition:all 0.3s ease}
        .sticky-cta:hover{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);transform:translateY(-3px);box-shadow:3px 3px 15px rgba(30,64,175,0.4)}

        #loading{background:linear-gradient(135deg,#1e40af 0%,#0f172a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
        .loading-logo{color:white;font-size:2rem;font-weight:800;margin-bottom:1rem}
        .loading-logo span{color:#059669}

        /* Login Specific - Glassmorphism */
        .glass-bg {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border-radius: 24px;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }
        
        @media (max-width:768px){.whatsapp-float{width:50px;height:50px;bottom:20px;right:20px;font-size:24px}.sticky-cta{bottom:20px;left:20px;padding:10px 20px;font-size:14px}}
    </style>
</head>
<body class="font-sans text-secondary bg-light flex flex-col min-h-screen">

    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 transition-opacity duration-500">
        <div class="loading-logo">Technovia<span>X</span></div>
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>
        <p class="text-white mt-4 font-medium">Securing Connection...</p>
    </div>

    <!-- Floating Buttons -->
    <a href="https://wa.me/918433125736" class="whatsapp-float" target="_blank" aria-label="Contact us on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    <a href="/contact.html" class="sticky-cta" id="sticky-contact-btn">
        <i class="fas fa-envelope"></i> Contact Us
    </a>

    <!-- Navigation Injection -->
    <script src="js/navigation.js" defer></script>

    <!-- Main Content -->
    <main class="flex-grow pt-24 pb-12 flex items-center justify-center glass-bg relative">
        <!-- Overlay for readability -->
        <div class="absolute inset-0 bg-gradient-to-br from-white/60 to-blue-50/70 backdrop-blur-[2px]"></div>

        <div class="container mx-auto px-4 relative z-10">
            <div class="max-w-md mx-auto glass-card overflow-hidden animate-fade-in-up">
                <div class="p-8">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-primary rounded-full mb-4 shadow-inner">
                            <i class="fas fa-user-shield text-3xl"></i>
                        </div>
                        <h1 class="text-3xl font-bold mb-2 text-secondary">Welcome Back</h1>
                        <p class="text-dark-light">Sign in to access your dashboard</p>
                    </div>

                    <!-- Login Area -->
                    <div id="login-container">
                        <!-- Google Login -->
                        <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-secondary font-semibold py-3 px-4 rounded-xl transition-all shadow-sm border border-gray-200 group transform hover:-translate-y-0.5 mb-6">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6 group-hover:scale-110 transition-transform">
                            <span>Sign in with Google</span>
                        </button>

                        <div class="relative my-6">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-4 bg-white/50 text-gray-500 font-medium backdrop-blur-sm rounded">or continue with email</span>
                            </div>
                        </div>

                        <!-- Email Form -->
                        <form id="email-login-form" class="space-y-5">
                            <div>
                                <label for="email" class="block text-sm font-bold text-secondary mb-1 ml-1">Email Address</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-envelope text-gray-400"></i>
                                    </div>
                                    <input type="email" id="email" class="w-full pl-10 pr-4 py-3 rounded-xl glass-input focus:outline-none" placeholder="name@company.com" required>
                                </div>
                            </div>
                            <div>
                                <label for="password" class="block text-sm font-bold text-secondary mb-1 ml-1">Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </div>
                                    <input type="password" id="password" class="w-full pl-10 pr-4 py-3 rounded-xl glass-input focus:outline-none" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-primary to-primary-light hover:from-primary-dark hover:to-primary text-white font-bold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-primary/30 flex items-center justify-center gap-2 mt-4 transform hover:scale-[1.02]">
                                <span>Sign In</span>
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </form>
                        
                        <p id="error-message" class="mt-4 text-center text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-100 hidden flex items-center justify-center gap-2">
                            <i class="fas fa-exclamation-circle"></i>
                            <span></span>
                        </p>
                    </div>

                    <!-- User Info Area (Visible after login) -->
                    <div id="user-container" class="hidden text-center py-6">
                        <div class="relative inline-block mb-4">
                            <img id="profile-pic" src="" alt="Profile" class="w-28 h-28 rounded-full border-4 border-white shadow-xl object-cover">
                            <div class="absolute bottom-1 right-1 w-6 h-6 bg-success border-2 border-white rounded-full"></div>
                        </div>
                        <h3 id="user-name" class="text-2xl font-bold text-secondary mb-1"></h3>
                        <p id="user-email" class="text-dark-light mb-8 font-medium bg-white/60 inline-block px-4 py-1 rounded-full text-sm shadow-sm"></p>
                        
                        <div class="grid gap-3">
                            <a href="/index.html" class="w-full bg-gradient-to-r from-primary to-primary-light text-white font-bold py-3 rounded-xl transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                                <i class="fas fa-tachometer-alt"></i> Go to Dashboard
                            </a>
                            <button id="sign-out-btn" class="w-full bg-white hover:bg-red-50 border border-gray-200 text-dark-light hover:text-red-600 font-bold py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 group">
                                <i class="fas fa-sign-out-alt group-hover:rotate-180 transition-transform duration-300"></i> Sign Out
                            </button>
                        </div>
                    </div>

                </div>
                <!-- Card Footer -->
                <div class="bg-white/40 backdrop-blur-md px-8 py-5 border-t border-white/40 text-center text-sm text-dark-light font-medium">
                    Don't have an account? <a href="/contact.html" class="text-primary hover:text-primary-dark hover:underline transition-colors font-bold">Contact Sales</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Injection -->
    <div id="footer-container"></div>
    <script src="js/footer.js" defer></script>

    <!-- Firebase Logic -->
    <script type="module" src="js/loginfirebase.js" defer></script>
    
    <!-- Init Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            if(loading) {
                setTimeout(() => {
                    loading.style.opacity = '0';
                    setTimeout(() => loading.style.display = 'none', 300);
                }, 300);
            }
        });
    </script>
</body>
</html>
